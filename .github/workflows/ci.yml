name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
      - name: Unit tests
        run: cargo test
      - name: Build the wasm
        run: ./scripts/build.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web app
        working-directory: web
        run: npm ci --no-audit --no-fund && npx vite build
